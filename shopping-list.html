<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #667eea;
    }

    .input-row button {
      padding: 12px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover { background: #5a67d8; }

    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      color: #4a5568;
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn[aria-pressed="true"] {
      border-color: #667eea;
      background: #667eea;
      color: #fff;
    }

    #list { list-style: none; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      transition: opacity 0.2s;
    }

    .item.done {
      opacity: 0.55;
    }

    .item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-all;
    }

    .item.done .item-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .del-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.2s, background 0.2s;
    }

    .del-btn:hover {
      color: #e53e3e;
      background: #fff5f5;
    }

    .empty {
      text-align: center;
      padding: 32px 0;
      color: #a0aec0;
      font-size: 0.95rem;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #718096;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #e53e3e;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .clear-btn:hover { background: #fff5f5; }
    .clear-btn:disabled { color: #cbd5e0; cursor: default; }
    .clear-btn:disabled:hover { background: none; }

    .error-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #e53e3e;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>쇼핑 리스트</h1>
  <p class="subtitle" id="subtitle">0개 항목</p>

  <div class="input-row">
    <label for="newItem">새 아이템</label>
    <input id="newItem" type="text" placeholder="아이템을 입력하세요..." maxlength="80" aria-label="새 아이템 입력">
    <button type="button" id="addBtn" aria-label="아이템 추가">추가</button>
  </div>

  <div class="filter-row" role="group" aria-label="목록 필터">
    <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">전체</button>
    <button type="button" class="filter-btn" data-filter="todo" aria-pressed="false">미완료</button>
    <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">완료</button>
  </div>

  <ul id="list" aria-label="쇼핑 목록" aria-live="polite"></ul>

  <div class="footer">
    <span id="countLabel"></span>
    <button type="button" class="clear-btn" id="clearBtn" aria-label="완료된 항목 모두 삭제">완료 항목 삭제</button>
  </div>
</div>

<div class="error-toast" id="errorToast" role="alert"></div>

<script>
  let items = [];
  let filter = 'all';

  const input = document.getElementById('newItem');
  const addBtn = document.getElementById('addBtn');
  const listEl = document.getElementById('list');
  const subtitle = document.getElementById('subtitle');
  const countLabel = document.getElementById('countLabel');
  const clearBtn = document.getElementById('clearBtn');
  const errorToast = document.getElementById('errorToast');

  try {
    items = JSON.parse(localStorage.getItem('shoppingList') || '[]');
  } catch (e) {
    showError('저장된 데이터를 불러오지 못했습니다.');
    items = [];
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  addBtn.addEventListener('click', addItem);
  clearBtn.addEventListener('click', clearDone);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter, btn));
  });

  function save() {
    try {
      localStorage.setItem('shoppingList', JSON.stringify(items));
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        showError('저장 공간이 부족합니다. 완료된 항목을 삭제해 보세요.');
      } else {
        showError('데이터를 저장하지 못했습니다.');
      }
    }
  }

  function addItem() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    items.unshift({ id: crypto.randomUUID(), text, done: false });
    input.value = '';
    save();
    render();
    input.focus();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function clearDone() {
    items = items.filter(i => !i.done);
    save();
    render();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    render();
  }

  function render() {
    const total = items.length;
    const doneCount = items.filter(i => i.done).length;
    const todoCount = total - doneCount;

    subtitle.textContent = `전체 ${total}개 · 완료 ${doneCount}개`;
    countLabel.textContent = `미완료 ${todoCount}개`;
    clearBtn.disabled = doneCount === 0;

    const visible = items.filter(i => {
      if (filter === 'done') return i.done;
      if (filter === 'todo') return !i.done;
      return true;
    });

    listEl.innerHTML = '';

    if (visible.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = filter === 'done' ? '완료된 항목이 없습니다.' : filter === 'todo' ? '미완료 항목이 없습니다.' : '아이템을 추가해 보세요!';
      listEl.appendChild(li);
      return;
    }

    visible.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item' + (item.done ? ' done' : '');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.setAttribute('aria-label', `${item.text} 완료 체크`);
      checkbox.addEventListener('change', () => toggleItem(item.id));

      const span = document.createElement('span');
      span.className = 'item-text';
      span.textContent = item.text;

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'del-btn';
      delBtn.setAttribute('aria-label', `${item.text} 삭제`);
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => deleteItem(item.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });
  }

  function showError(msg) {
    errorToast.textContent = msg;
    errorToast.style.display = 'block';
    setTimeout(() => { errorToast.style.display = 'none'; }, 3000);
  }

  render();
</script>
</body>
</html>
