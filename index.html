<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #007aff;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 20px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  #item-input:focus {
    border-color: var(--accent);
  }
  #add-btn {
    padding: 12px 18px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #add-btn:active {
    opacity: 0.8;
  }
  .summary {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 10px;
    text-align: right;
  }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-radius: 12px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li span {
    flex: 1;
    font-size: 16px;
    word-break: break-word;
  }
  li.checked span {
    text-decoration: line-through;
    color: var(--muted);
  }
  li button.delete-btn {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <div class="input-row">
    <input type="text" id="item-input" placeholder="살 물건을 입력하세요" autofocus>
    <button id="add-btn">추가</button>
  </div>
  <div class="summary" id="summary"></div>
  <ul id="list"></ul>
</div>

<script>
  const STORAGE_KEY = 'shopping-list-items';
  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('item-input');
  const addBtn = document.getElementById('add-btn');
  const summaryEl = document.getElementById('summary');

  let items = loadItems();

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    listEl.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '아직 담긴 항목이 없어요. 위에서 추가해 보세요!';
      listEl.appendChild(empty);
    } else {
      items.forEach(item => {
        const li = document.createElement('li');
        if (item.checked) li.classList.add('checked');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.checked;
        checkbox.addEventListener('change', () => toggleItem(item.id));

        const span = document.createElement('span');
        span.textContent = item.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    const total = items.length;
    const done = items.filter(i => i.checked).length;
    summaryEl.textContent = total > 0 ? `${done} / ${total} 완료` : '';
  }

  function addItem() {
    const text = inputEl.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, checked: false });
    inputEl.value = '';
    saveItems();
    render();
    inputEl.focus();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.checked = !item.checked;
    saveItems();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    saveItems();
    render();
  }

  addBtn.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem();
  });

  render();
</script>
</body>
</html>
